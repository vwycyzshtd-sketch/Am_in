name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Compile Python files
        run: uv run python -m py_compile agents_text.py browser_agent.py livekit_agent.py healthcheck.py
      - name: Import smoke test
        run: |
          uv run python - <<'PY'
          import agents
          import browser_use
          import livekit.agents
          import livekit.plugins.openai
          print("All core imports succeeded")
          PY
